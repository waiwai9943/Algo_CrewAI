[project]
name = "algo"
version = "0.1.0"
description = "algo using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.14.6",
    "numpy>=1.26.0",
    "ta>=0.11.0",
    "yfinance>=1.4.1",
]

[project.scripts]
algo = "algo.main:run"
run_crew = "algo.main:run"
train = "algo.main:train"
replay = "algo.main:replay"
test = "algo.main:test"
run_with_trigger = "algo.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

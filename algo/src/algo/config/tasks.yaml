strategy_design_task:
  description: >
    You are the Senior Quantitative Researcher. Your job is to design a rigorous
    trend-following and momentum breakout strategy for the Dow Jones (YM=F) or Crude Oil (CL=F) on 5-minute bars.

    STEP 1 — Fetch historical data:
      Use the "Market Data Fetcher" tool to pull initial data for YM=F or CL=F,
      or acknowledge the local datasets exported at:
      - C:\QuantDataManager125\export\2026.6.7USA30IDXUSD-M5-No Session.csv
      - C:\QuantDataManager125\export\2026.6.7LIGHTCMDUSD-M5-No Session.csv

    STEP 2 — Compute indicators:
      Use the "Indicator Calculator" tool to compute trend-following indicators:
        input_file = "market_data.json"
        output_file = "indicator_data.json"
        rsi_period = 14
      (You may conceptualize other indicators like ADX, MACD, or Moving Average alignment
       that you will instruct the engineer to build).
      Study the returned indicator statistics carefully:
        - What is the prevailing trend momentum?
        - How often does the market trend versus chop?

    STEP 3 — Design the strategy specification:
      Based on your momentum analysis, produce a complete
      strategy specification document with the following sections:

      A. PARAMETERS TABLE:
         List all parameters (e.g., ADX thresholds, EMA lengths, MACD settings) 
         with chosen values and justification.

      B. ENTRY CONDITIONS (LONG & SHORT):
         Specify the exact momentum breakout and trend-following conditions.
         For example: EMA alignment + ADX > 25 + Breakout of X-period high.

      C. EXIT CONDITIONS:
         - Take-profit: Define wide take profits to capture massive trends (e.g., 100+ points).
         - Stop-loss: Define a trailing stop or structure-based stop to avoid gap execution risks.
         - EOD exit: specify cutoff in bars from session end.

      D. MARKET REGIME FILTER:
         When should the strategy NOT trade? (e.g., choppy periods with ADX < 20).

      E. STATISTICAL RATIONALE:
         Explain why this trend-following edge works on the 5-minute NQ chart.

    IMPORTANT: Your parameter choices MUST be grounded in trend-following principles
    designed to survive execution slippage and gaps. Do not use tight mean-reversion targets.
  expected_output: >
    A validated trend-following strategy specification containing:
    - Target instrument and timeframe justification (5-min)
    - Indicator formulas (e.g., EMA, MACD, ADX)
    - Specific Long/Short momentum entry logic
    - Wide Target and Trailing Stop Loss logic
    - Walk Forward Optimization (WFO) Research explanation
  agent: quant_researcher

backtest_task:
  description: >
    You are the Senior Quantitative Researcher continuing your analysis.
    You have just designed the trend strategy specification.
    Now you must formally structure a Backtest Plan for this trend strategy.

    STEP 1 — Use the existing indicator files directly:
      Do NOT call the "Market Data Fetcher" or "Indicator Calculator" tools. 
      They have already run in the previous task. 

    STEP 2 — Run the primary backtest:
      Use the "Strategy Backtester" tool with the parameters from your
      trend strategy specification. Use wide targets and stops:
        take_profit_ticks: 400  # 100 points
        stop_loss_ticks: 100    # 25 points
        instrument: "YM" or "CL"
        slippage_ticks: 2       # Account for momentum slippage
        commission_per_rt: 4.10

    STEP 3 — Sensitivity analysis (run 2-3 additional parameter variants):
      Test at least 2 variations of your trend thresholds.
      Use different output filenames for each run.

    STEP 4 — Produce the Backtest Report:
      Summarise all backtest runs in a clear comparison table showing:
        - Parameter set used
        - Total trades, Win Rate %, Avg R:R
        - Net P&L ($), Profit Factor
        - Max Drawdown ($), Sharpe Ratio (annualised)

      Then provide your recommendation.
  expected_output: >
    A comprehensive Trend Following Backtest Report containing:
    - A comparison table of all tested parameter sets with full metrics
    - Identification of the best-performing parameter set with justification
    - Assessment of momentum execution risks (gaps, slippage)
    - Final recommended parameters for live implementation
  agent: quant_researcher
  context:
    - strategy_design_task

code_architecture_task:
  description: >
    You are the Strategy Engineer. You have received the validated trend-following strategy
    specification AND backtest results from the Quant Researcher.

    Your job is to translate the empirically validated strategy into a complete
    Python code architecture blueprint using ib_insync for Interactive Brokers.

    YOUR DELIVERABLE must include:

    1. IMPLEMENTABILITY REVIEW:
       - Review the researcher's chosen trend parameters.
       - Note computational requirements for trailing stops or breakout conditions.

    2. MODULE STRUCTURE (directory tree):
         algo_live/
           config.py          # Trend strategy parameters
           indicators.py      # Trend indicators (EMA, MACD, ADX, Donchian)
           signal_engine.py   # Momentum signal generation
           order_manager.py   # Trailing stops and bracket orders
           data_handler.py    # ib_insync real-time 5-min bars
           risk_guard.py      # Pre-trade risk checks
           main_bot.py        # Main async event loop

    3. KEY CODE SKELETONS (actual Python, not pseudo-code):
       Write skeletons for config.py, indicators.py, data_handler.py, signal_engine.py, and order_manager.py.

    Use type hints and docstrings throughout. Mark TODOs clearly.
  expected_output: >
    A complete code architecture document for a Trend-Following system.
  agent: strategy_engineer
  context:
    - strategy_design_task
    - backtest_task

risk_review_task:
  description: >
    You are the Chief Risk Officer. You have received the trend strategy specification,
    backtest results, AND the code architecture blueprint in your context.

    Perform a comprehensive adversarial risk review focusing on overnight hold risks, 
    false breakouts, and trend exhaustion.

    YOUR REVIEW must cover:
    1. BACKTEST REALITY CHECK: Is the win rate realistic for trend following? (Trend following often has 30-40% win rates with massive R:R).
    2. STRATEGY-LEVEL FAILURE SCENARIOS: e.g., sideways chop markets grinding down the account.
    3. MANDATORY RISK CONTROLS: Trailing stops, daily drawdown breaker.
    4. risk_guard.py CODE (actual Python, syntactically correct).
    5. RISK CONTROL ADDENDUM (formal numbered rules).
    6. GO / NO-GO RECOMMENDATION.
  expected_output: >
    A complete Risk Control Document focusing on Trend-Following risks.
    Saved as the final deliverable: risk_control_addendum.md
  agent: risk_manager
  context:
    - strategy_design_task
    - backtest_task
    - code_architecture_task
